name: Upstream Codex parity

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-drift:
    name: Detect upstream main drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate pin and compare upstream branch head
        run: python3 Scripts/check_upstream_parity.py --check-upstream-head
